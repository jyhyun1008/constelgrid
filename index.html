<html lang="ko">
<head>

    <title>별자리 메모보드 - 무한 캔버스 위의 아이디어 모음집</title>

    <style>
        :root {
            --bg-color: #f8f9fa;
            --lightgray-color: var(--lightgray-color);
            --grid-color: #e1e4e8;
            --accent-color: #ADD8E6;
            --tool-border: #ddd;
            --tool-bg: #ffffff88;
            --tool-fg: #555;
            --accent-light-color: #ADD8E655;
            --accent-snd-color: #b5c2ff;
            --danger-color: #FF8DA1;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        .dark-mode {
            --bg-color: #2e313d;
            --lightgray-color: #424755;
            --grid-color: #585d6e;
            --accent-color: #6b63a5;
            --tool-border: #6f7486;
            --tool-bg: #1b1d2588;
            --tool-fg: #d8dbe7;
            --accent-light-color: #6b63a58b;
            --accent-snd-color: #637ea5;
            --danger-color: #6b63a5;
            --text-color: #f8f9fa;
            --card-bg: #1b1d25;
        }

        .light-mode {
            --bg-color: #f8f9fa;
            --lightgray-color: #f1f3f5;
            --grid-color: #e1e4e8;
            --accent-color: #ADD8E6;
            --tool-border: #ddd;
            --tool-bg: #ffffff88;
            --tool-fg: #555;
            --accent-light-color: #ADD8E655;
            --accent-snd-color: #b5c2ff;
            --danger-color: #FF8DA1;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
        :root {
            --bg-color: #2e313d;
            --lightgray-color: #424755;
            --grid-color: #585d6e;
            --accent-color: #6b63a5;
            --tool-border: #6f7486;
            --tool-bg: #1b1d2588;
            --tool-fg: #d8dbe7;
            --accent-light-color: #6b63a58b;
            --accent-snd-color: #637ea5;
            --danger-color: #6b63a5;
            --text-color: #f8f9fa;
            --card-bg: #1b1d25;
        }
        }  

@font-face {
    font-family: 'A2z';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-4Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
}

@font-face {

    font-display: swap;
}


@font-face {

    font-weight: 400;
    font-display: swap;
}

@font-face {
    font-family: 'Pretendard';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
}

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'A2z';}
        
        body {
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            user-select: none;
            -ms-overflow-style: none;
        }
 
        ::-webkit-scrollbar {
        display: none;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        blockquote {
            background-color: var(--bg-color);
            border-radius: 10px;
            padding: 0 10px;
            border-left: 2px solid var(--accent-color);
        }

        /* 1. 뷰포트 (카메라) */
        #viewport {
            width: 100vw; height: 100vh;
            position: relative;
            overflow: hidden;
            cursor: grab;
            background-image: radial-gradient(var(--grid-color) 2px, transparent 2px);
            background-size: 24px 24px;
        }
        #viewport:active { cursor: grabbing; }

        /* 2. 월드 (콘텐츠 컨테이너) */
        #world {
            position: absolute;
            top: 0; left: 0;
            width: 0; height: 0; /* 크기 0으로 설정하되 내용은 넘치게 */
            transform-origin: 0 0;
            will-change: transform;
        }

        /* SVG 레이어 (수정됨: 크기를 1px로 잡고 overflow: visible로 선이 삐져나오게 함) */
        #connections-layer {
            position: absolute;
            top: 0; left: 0;
            width: 1px; height: 1px; 
            overflow: visible; /* 핵심: 영역 밖의 선도 보이게 함 */
            pointer-events: none;
            z-index: 0;
        }

        /* --- 메모 스타일 --- */
        .memo {
            position: absolute;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            z-index: 10;
            cursor: default;
            display: flex; flex-direction: column;
            transition: box-shadow 0.2s;
            /*border: 2px solid transparent;  선택 시 보더 공간 확보 */
        }
        
        .memo-drag-handle {
            height: 24px;
            cursor: grab;
            width: 100%;
            position: absolute; top:0; left:0;
            z-index: 5;
            border-radius: 12px 12px 0 0;
            background-color: var(--accent-light-color);
        }
        .memo-drag-handle:active { cursor: grabbing; }

        .memo:hover {
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15);
            z-index: 50;
        }
        .memo.selected { border: 2px solid var(--accent-color); z-index: 60; }

        .memo.text { width: 220px; min-height: 120px;  padding: 16px; padding-top: 28px; }
        .memo.text .memo-content { overflow-y: auto; max-height: 200px;
        }
        .memo.link { width: 300px; padding: 0; padding-top: 24px; overflow: hidden; font-size: 14px; }

        .memo-content img {
            width: 100%;
        }

        /* 링크 카드 스타일 */
        .link-image { width: 100%; height: 150px; background: var(--lightgray-color); object-fit: cover; border-bottom: 1px solid var(--grid-color); }
        .link-info { padding: 12px; }
        .link-title { font-weight: bold; margin-bottom: 6px; line-height: 1.3; }
        .link-desc { font-size: 12px; color: #666; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .link-domain { font-size: 11px; color: #999; margin-top: 8px; text-transform: uppercase; }

        .memo-content { flex-grow: 1; font-size: 14px; line-height: 1.8; white-space: normal; }
        .memo-content h1, .memo-content h2 { font-size: 1.1em; border-bottom: 1px solid var(--grid-color); margin-bottom: 5px; }
        .memo-content ul, .memo-content ol {
            padding-inline-start: 24px;
        }
        .memo-content p, .memo-content ul, .memo-content ol {
            padding-top: 5px;
            padding-bottom: 5px;
        }

        .memo-tools {
            position: absolute; top: 5px; right: 5px;
            opacity: 0; transition: opacity 0.2s; z-index: 100;
        }
        .memo:hover .memo-tools { opacity: 1; }
        .tool-btn {
            background: var(--tool-bg); border: 1px solid var(--tool-border);
            border-radius: 50%; width: 24px; height: 24px;
            cursor: pointer; color: var(--tool-fg); display: inline-flex; align-items: center; justify-content: center;
        }
        .tool-btn:hover { color: var(--accent-color); border-color: var(--accent-color); }

        #toolbar {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg); backdrop-filter: blur(5px);
            padding: 10px 20px; border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex; gap: 10px; z-index: 1000;
            align-items: center;
        }
        .btn {
            background: var(--card-bg); border: 1px solid var(--grid-color);
            padding: 8px 16px; border-radius: 20px;
            cursor: pointer; font-weight: 600; color: var(--tool-fg);
            transition: 0.2s; font-size: 13px; white-space: nowrap;
        }
        .btn:hover { background: var(--lightgray-color); transform: translateY(-1px); }
        .btn.primary { background: var(--accent-color); color: white; border: none; }
        .btn.primary:hover { background: var(--accent-snd-color) }
        .btn.danger { color: var(--danger-color); }
        .btn.misskey {
            background: #86b300; color: white;
        }
        .btn.none {
            display: none;
        }

        .btn svg, .btn img {
            margin-bottom: -3px;
        }

        #status-bar {
            position: fixed; top: 20px; left: 20px;
            font-size: 12px; color: #999; pointer-events: none;
            background: var(--tool-bg); padding: 5px 10px; border-radius: 10px;
        }

        /* 에디터 모달 */
        #editor-modal {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 9999;
            justify-content: center; align-items: center;
        }
        #editor-modal.active { display: flex !important; }
        .modal-card {
            background: var(--card-bg); padding: 24px; border-radius: 16px;
            width: 500px; max-width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
        }
        textarea {
            width: 100%; height: 200px; margin: 15px 0; padding: 15px;
            border: 1px solid var(--grid-color); border-radius: 8px;
            font-family: monospace; resize: none;
            background-color: var(--card-bg); color: var(--text-color);
        }
        #file-input { display: none; }

        .tool-pill {
            background: var(--tool-bg); border: 1px solid var(--tool-border); color: var(--tool-fg);
            border-radius: 12px; height: 24px; padding: 0 10px; font-size: 12px; font-weight: 700;
            cursor: pointer; display: inline-flex; align-items: center; vertical-align: top;
        }
        .tool-pill:hover { color: var(--accent-color); border-color: var(--accent-color); }
        .tool-pill.on { background: var(--accent-color); border-color: var(--accent-color); color: white; }

        /* 퀘스트에서 웹 창으로 열려 있는 북마크 표시 */
        .web-badge {
            position: absolute; top: 32px; left: 8px; z-index: 3;
            display: flex; align-items: center; gap: 4px;
            background: var(--accent-color); color: white;
            font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
            pointer-events: none;
        }

    </style>

<script>

lucide.createIcons();
    
window.oncontextmenu=function() {
    return false;
}

if (localStorage.getItem('lightdark')) {
    if (localStorage.getItem('lightdark') == 'light') {
        document.body.classList.remove('dark-mode');
        document.body.classList.add('light-mode');
        document.querySelector('#toggledark').innerHTML = '<i data-lucide="moon-star"></i>'
        lucide.createIcons();
        localStorage.setItem('lightdark', 'light')
    }
} else {
    localStorage.setItem('lightdark', 'dark')
}

if (localStorage.getItem('accessToken')) {
    document.querySelector('#signin > a').innerHTML = '<i data-lucide="log-out"></i>'
    document.querySelector('#export').classList.add('misskey')
    document.querySelector('#export').innerHTML = '<i data-lucide="cloud-upload"></i>'
    lucide.createIcons();
    document.querySelector('#import').classList.add('none')
    document.querySelector('#fetch').classList.remove('none')
}

const app = {
    
    data: { memos: [], connections: [] },
    ui: {
        camera: { x: 0, y: 0 },
        selectedMemoIds: new Set(),
        mode: 'idle', 
        lastMouse: { x: 0, y: 0 },
        draggedMemoId: null,
        editingId: null
    },
    
    init() {
        this.loadFromStorage();
        this.updateTransform(); 
        this.setupEvents();
    },

    toggledark() {
        if (document.body.classList.contains('dark-mode')) {
            document.body.classList.remove('dark-mode');
            document.body.classList.add('light-mode');
            document.querySelector('#toggledark').innerHTML = '<i data-lucide="moon-star"></i>'
            lucide.createIcons();
            localStorage.setItem('lightdark', 'light')
        } else {
            document.body.classList.remove('light-mode');
            document.body.classList.add('dark-mode');
            document.querySelector('#toggledark').innerHTML = '<i data-lucide="sun"></i>'
            lucide.createIcons();
            localStorage.setItem('lightdark', 'dark')
        }
    },

    // 퀘스트의 웹 창 = 북마크 메모(type: link)에 spatial.window 표시가 붙은 것.
    // 예전 형식(data.spatial.webs)은 북마크로 옮김
    migrateWebs() {
        const webs = (this.data.spatial && this.data.spatial.webs) || [];
        webs.forEach(w => {
            if (this.data.memos.some(m => m.id === w.id)) return;
            const memo = { id: w.id, type: 'link', url: w.url, meta: w.meta || null, spatial: { ...(w.spatial || {}), window: true } };
            if (typeof w.x === 'number') { memo.x = w.x; memo.y = w.y; }
            this.data.memos.push(memo);
        });
        if (this.data.spatial) delete this.data.spatial.webs;
    },
    findItem(id) {
        return this.data.memos.find(m => m.id === id);
    },
    itemSize(item) {
        return item.type === 'link' ? { w: 300, h: 250 } : { w: 220, h: 120 };
    },
    // 제목/대표 이미지가 아직 없는 북마크는 불러와서 채움
    async fetchLinkMeta(memo) {
        try {
            const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(memo.url)}`);
            const json = await res.json();
            if (json.status !== 'success') throw new Error();
            const meta = json.data;
            memo.meta = {
                title: meta.title || memo.url,
                desc: meta.description || '',
                image: meta.image ? meta.image.url : null,
                publisher: meta.publisher || new URL(memo.url).hostname
            };
        } catch (e) {
            let host = '';
            try { host = new URL(memo.url).hostname; } catch (e2) {}
            // 실패(하루 요청 한도 등)는 표시해 두고, 다음에 페이지를 열 때 다시 시도
            memo.meta = { title: memo.url, desc: '', image: null, publisher: host, failed: true };
        }
        this.render(); this.saveToStorage();
    },
    escape(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    },

    /**
     * 퀘스트에서만 만든 것(2D 위치 없음)은 VR 위치를 평면에 정사영해서 2D 위치를 정함.
     * 투영면: VR 속 물건들이 가로로 퍼진 방향(x,z의 주성분)을 가로축, 높이를 세로축으로 하는 수직 평면.
     * 2D와 VR 위치를 둘 다 가진 메모들에 맞춰 좌우 방향과 위치를 맞춘다.
     */
    layoutFromSpatial() {
        const hasXY = i => typeof i.x === 'number' && typeof i.y === 'number';
        const items = this.data.memos;
        const missing = items.filter(i => !hasXY(i));
        if (!missing.length) return;

        const spatial = items.filter(i => i.spatial && Array.isArray(i.spatial.p));
        const PX_PER_M = 800;
        let proj = null;
        if (spatial.length) {
            const mx = spatial.reduce((a, i) => a + i.spatial.p[0], 0) / spatial.length;
            const mz = spatial.reduce((a, i) => a + i.spatial.p[2], 0) / spatial.length;
            let sxx = 0, sxz = 0, szz = 0;
            spatial.forEach(i => {
                const dx = i.spatial.p[0] - mx, dz = i.spatial.p[2] - mz;
                sxx += dx * dx; sxz += dx * dz; szz += dz * dz;
            });
            // 퍼짐이 거의 없으면 처음 바라보던 방향(-z)의 오른쪽(+x)을 가로축으로
            const angle = (sxx + szz > 1e-6) ? 0.5 * Math.atan2(2 * sxz, sxx - szz) : 0;
            let ax = Math.cos(angle), az = Math.sin(angle);
            const u = i => (i.spatial.p[0] - mx) * ax + (i.spatial.p[2] - mz) * az;
            // 좌우 방향: 기준 메모들의 2D x와 같은 방향이 되게, 기준이 없으면 원점에서 바라본 오른쪽이 +가 되게
            const refs = spatial.filter(hasXY);
            let corr = 0;
            if (refs.length >= 2) {
                const ux = refs.reduce((a, i) => a + u(i), 0) / refs.length;
                const xx = refs.reduce((a, i) => a + i.x, 0) / refs.length;
                refs.forEach(i => { corr += (u(i) - ux) * (i.x - xx); });
            } else {
                // 원점에서 가운데를 보는 방향 f=(mx,mz)의 오른쪽은 (-mz, mx)
                corr = ax * -mz + az * mx;
            }
            if (corr < 0) { ax = -ax; az = -az; }
            proj = i => ({ x: u(i) * PX_PER_M, y: -i.spatial.p[1] * PX_PER_M });

            // 위치 맞추기: 기준 메모들의 (2D 가운데 - 투영) 평균만큼 옮김
            let tx, ty;
            if (refs.length) {
                tx = refs.reduce((a, i) => a + (i.x + this.itemSize(i).w / 2 - proj(i).x), 0) / refs.length;
                ty = refs.reduce((a, i) => a + (i.y + this.itemSize(i).h / 2 - proj(i).y), 0) / refs.length;
            } else {
                const c = this.getCenterCoordinates();
                const pc = spatial.map(proj);
                tx = c.x - pc.reduce((a, p) => a + p.x, 0) / pc.length;
                ty = c.y - pc.reduce((a, p) => a + p.y, 0) / pc.length;
            }
            missing.filter(i => i.spatial && Array.isArray(i.spatial.p)).forEach(i => {
                const p = proj(i), size = this.itemSize(i);
                i.x = p.x + tx - size.w / 2;
                i.y = p.y + ty - size.h / 2;
            });
        }

        // VR 위치도 없으면 메모들 오른쪽에 세로로
        const rest = items.filter(i => !hasXY(i));
        if (rest.length) {
            const placed = items.filter(hasXY);
            const c = this.getCenterCoordinates();
            const right = placed.length ? Math.max(...placed.map(i => i.x + this.itemSize(i).w)) : c.x;
            const top = placed.length ? Math.min(...placed.map(i => i.y)) : c.y;
            rest.forEach((i, k) => { i.x = right + 80; i.y = top + k * 340; });
        }
        this.saveToStorage();
    },
    youtubeId(url) {
        const m = (url || '').match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/);
        return m && m[1];
    },
    async fetchWebMeta(web) {
        try {
            const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(web.url)}`);
            const json = await res.json();
            if (json.status !== 'success') throw new Error();
            const meta = json.data;
            web.meta = {
                title: meta.title || web.url,
                desc: meta.description || '',
                image: meta.image ? meta.image.url : null,
                publisher: meta.publisher || new URL(web.url).hostname
            };
        } catch (e) {
            web.meta = { title: web.url, desc: '', image: null, publisher: '' };
        }
        this.render(); this.saveToStorage();
    },
    escape(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    },

    getCenterCoordinates() {
        return {
            x: -this.ui.camera.x + window.innerWidth / 2,
            y: -this.ui.camera.y + window.innerHeight / 2
        };
    },

    createMemo(content = '') {
        const center = this.getCenterCoordinates();
        this.data.memos.push({
            id: 'memo_' + Date.now(),
            type: 'text',
            content: content || '# 아이디어\n내용을 입력하세요.',
            x: center.x - 110 + (Math.random() * 40 - 20),
            y: center.y - 60 + (Math.random() * 40 - 20)
        });
        this.render();
        this.saveToStorage();
    },

    async addLink() {
        const url = prompt("북마크할 URL (유튜브, 블로그 등):");
        if (!url) return;
        const center = this.getCenterCoordinates();
        const tempId = 'memo_' + Date.now();
        
        this.data.memos.push({
            id: tempId, type: 'text', content: '⏳ 정보 불러오는 중...',
            x: center.x - 150, y: center.y - 80
        });
        this.render();

        try {
            const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
            const json = await res.json();

            if (json.status === 'success') {
                const meta = json.data;
                const idx = this.data.memos.findIndex(m => m.id === tempId);
                if(idx !== -1) {
                    const placeholder = this.data.memos[idx];
                    this.data.memos[idx] = {
                        id: tempId, type: 'link', url: url,
                        meta: {
                            title: meta.title || url,
                            desc: meta.description || '',
                            image: meta.image ? meta.image.url : null,
                            publisher: meta.publisher || new URL(url).hostname
                        },
                        x: placeholder.x, y: placeholder.y
                    };
                }
            } else { throw new Error(); }
        } catch (e) {
            const idx = this.data.memos.findIndex(m => m.id === tempId);
            if(idx !== -1) this.data.memos[idx].content = url;
        }
        this.render();
        this.saveToStorage();
    },

    // --- 연결 생성 ---
    connectSelected() {
        const ids = Array.from(this.ui.selectedMemoIds);
        if (ids.length !== 2) { alert("연결하려면 Shift+클릭으로 2개를 선택하세요."); return; }
        
        const exists = this.data.connections.some(c => 
            (c.from === ids[0] && c.to === ids[1]) || (c.from === ids[1] && c.to === ids[0])
        );
        if (!exists) {
            this.data.connections.push({ from: ids[0], to: ids[1] });
            this.ui.selectedMemoIds.clear();
            this.render();
            this.saveToStorage();
        }
    },

    // --- [NEW] 연결 끊기 ---
    disconnectSelected() {
        const ids = Array.from(this.ui.selectedMemoIds);
        if (ids.length !== 2) { alert("연결을 끊으려면 Shift+클릭으로 연결된 2개를 선택하세요."); return; }

        // 기존 연결 목록에서 선택된 두 ID의 조합을 제거
        const initialCount = this.data.connections.length;
        this.data.connections = this.data.connections.filter(c => 
            !((c.from === ids[0] && c.to === ids[1]) || (c.from === ids[1] && c.to === ids[0]))
        );

        if (this.data.connections.length === initialCount) {
            alert("두 메모는 연결되어 있지 않습니다.");
        } else {
            this.ui.selectedMemoIds.clear();
            this.render();
            this.saveToStorage();
        }
    },

    // --- Rendering ---
    
    updateTransform() {
        const world = document.getElementById('world');
        const viewport = document.getElementById('viewport');
        const status = document.getElementById('status-bar');
        world.style.transform = `translate(${this.ui.camera.x}px, ${this.ui.camera.y}px)`;
        viewport.style.backgroundPosition = `${this.ui.camera.x}px ${this.ui.camera.y}px`;
        status.innerText = `별자리 메모보드! - Canvas: ${Math.round(-this.ui.camera.x)}, ${Math.round(-this.ui.camera.y)}`;
    },

    // 카드 내용이 바뀌었는지 판단하는 값 (위치/선택은 제외)
    memoKey(memo) {
        return JSON.stringify([memo.type, memo.content, memo.url, memo.meta, this.isWindow(memo)]);
    },

    render() {
        const memosLayer = document.getElementById('memos-layer');
        const connectionsLayer = document.getElementById('connections-layer');
        connectionsLayer.innerHTML = ''; // SVG 초기화
        this.layoutFromSpatial();

        // 메모 렌더링: 내용이 바뀐 카드만 새로 만들고, 나머지는 위치만 옮김
        // (웹 창 안의 사이트가 끌 때마다 새로고침되지 않게)
        if (!this.els) this.els = new Map();
        const alive = new Set();
        this.data.memos.forEach(memo => {
            alive.add(memo.id);
            const key = this.memoKey(memo);
            let rec = this.els.get(memo.id);
            if (!rec || rec.key !== key || !rec.el.isConnected) {
                const el = this.buildMemoEl(memo);
                if (rec && rec.el.isConnected) rec.el.replaceWith(el); else memosLayer.appendChild(el);
                rec = { el, key };
                this.els.set(memo.id, rec);
            }
            rec.el.style.left = `${memo.x}px`;
            rec.el.style.top = `${memo.y}px`;
            rec.el.classList.toggle('selected', this.ui.selectedMemoIds.has(memo.id));
        });
        for (const [id, rec] of this.els) {
            if (!alive.has(id)) { rec.el.remove(); this.els.delete(id); }
        }

        // 선 렌더링
        this.data.connections.forEach(conn => {
            const from = this.findItem(conn.from);
            const to = this.findItem(conn.to);
            if (from && to) {
                const { w: w1, h: h1 } = this.itemSize(from);
                const { w: w2, h: h2 } = this.itemSize(to);
                
                const x1 = from.x + w1/2, y1 = from.y + h1/2;
                const x2 = to.x + w2/2, y2 = to.y + h2/2;
                const dist = Math.abs(x2 - x1) * 0.5;

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", `M ${x1} ${y1} C ${x1 + dist} ${y1}, ${x2 - dist} ${y2}, ${x2} ${y2}`);
                path.setAttribute("stroke", "#9b9fa388");
                path.setAttribute("stroke-width", "3");
                path.setAttribute("fill", "none");
                connectionsLayer.appendChild(path);
            }
        });
    },

    buildMemoEl(memo) {
        const el = document.createElement('div');
        const win = this.isWindow(memo);
        el.className = `memo ${memo.type}`;
        el.dataset.id = memo.id;

        let innerHTML = '';
        let tools = '';
        if (memo.type === 'link' && memo.meta && memo.meta.failed && !memo._loading) {
            memo._loading = true; this.fetchLinkMeta(memo);
        }
        if (memo.type === 'link' && !memo.meta) {
            if (!memo._loading) { memo._loading = true; this.fetchLinkMeta(memo); }
            innerHTML = `<div class="memo-content" style="padding:16px">⏳ 정보 불러오는 중...</div>`;
        } else if (memo.type === 'link') {
            const imgTag = memo.meta.image ? `<img src="${memo.meta.image}" class="link-image">` : `<div class="link-image" style="background:var(--lightgray-color);"></div>`;
            innerHTML = `
                ${imgTag}
                <div class="link-info">
                    <div class="link-title">${memo.meta.title}</div>
                    <div class="link-desc">${memo.meta.desc}</div>
                    <div class="link-domain">🔗 ${memo.meta.publisher}</div>
                </div>
                ${win ? `<div class="web-badge">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
                    웹 창
                </div>` : ''}
                <a href="${memo.url}" target="_blank" style="position:absolute;top:24px;left:0;width:100%;bottom:0;" onclick="event.stopPropagation()"></a>
            `;
            // 퀘스트에서 웹 창으로 보일지 켜고 끄기
            tools = `<button class="tool-pill toggle-window ${win ? 'on' : ''}" title="${win ? '퀘스트에서 북마크 카드로 보이기' : '퀘스트에서 웹 창으로 보이기'}">웹 창 ${win ? '끄기' : '켜기'}</button>`;
        } else {
            const md = typeof marked !== 'undefined' ? marked.parse(memo.content) : memo.content;
            innerHTML = `<div class="memo-content">${md}</div>`;
        }

        el.innerHTML = `
            <div class="memo-drag-handle"></div>
            <div class="memo-tools">
                ${tools}
                <button class="tool-btn edit-btn">✎</button>
            </div>
            ${innerHTML}
        `;

        el.addEventListener('mousedown', (e) => this.handleMemoMouseDown(e, memo.id));
        el.querySelector('.edit-btn').addEventListener('mousedown', (e) => {
            e.stopPropagation(); e.preventDefault();
            this.openEditor(memo.id);
        });
        const toggle = el.querySelector('.toggle-window');
        if (toggle) toggle.addEventListener('mousedown', (e) => { e.stopPropagation(); e.preventDefault(); this.setWindow(memo.id, !win); });
        return el;
    },

    // --- 웹 창 (퀘스트와 같은 spatial.window 표시를 씀) ---
    isWindow(memo) {
        return memo.type === 'link' && !!(memo.spatial && memo.spatial.window);
    },
    setWindow(id, on) {
        const memo = this.findItem(id);
        if (!memo) return;
        memo.spatial = memo.spatial || {};
        if (on) memo.spatial.window = true; else delete memo.spatial.window;
        delete memo.spatial.s; // 퀘스트의 창 크기도 종류가 바뀌니 초기화
        this.render(); this.saveToStorage();
    },
    // --- Interaction ---
    setupEvents() {
        const viewport = document.getElementById('viewport');
        viewport.addEventListener('mousedown', (e) => {
            if (e.target.id === 'viewport' || e.target.id === 'world' || e.target.id === 'connections-layer') {
                this.ui.mode = 'panning';
                this.ui.lastMouse = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (this.ui.mode === 'panning') {
                const dx = e.clientX - this.ui.lastMouse.x;
                const dy = e.clientY - this.ui.lastMouse.y;
                this.ui.camera.x += dx; this.ui.camera.y += dy;
                this.updateTransform();
                this.ui.lastMouse = { x: e.clientX, y: e.clientY };
            } else if (this.ui.mode === 'dragging_memo' && this.ui.draggedMemoId) {
                const dx = e.clientX - this.ui.lastMouse.x;
                const dy = e.clientY - this.ui.lastMouse.y;
                const memo = this.findItem(this.ui.draggedMemoId);
                if (memo) {
                    memo.x += dx; memo.y += dy;
                    const el = document.querySelector(`.memo[data-id="${memo.id}"]`);
                    if(el) { el.style.left = memo.x+'px'; el.style.top = memo.y+'px'; }
                    requestAnimationFrame(() => this.render());
                }
                this.ui.lastMouse = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('mouseup', () => {
            if (this.ui.mode !== 'idle') {
                this.ui.mode = 'idle';
                this.ui.draggedMemoId = null;
                this.saveToStorage();
            }
        });
    },

    handleMemoMouseDown(e, id) {
        if(e.button !== 0 && e.button < 2) return;
        e.stopPropagation();

        if ((e.button === 2)||(e.which === 3)) {
            if (this.ui.selectedMemoIds.has(id)) this.ui.selectedMemoIds.delete(id);
            else this.ui.selectedMemoIds.add(id);
            this.render();
            return;        
        }

        if (e.shiftKey) {
            if (this.ui.selectedMemoIds.has(id)) this.ui.selectedMemoIds.delete(id);
            else this.ui.selectedMemoIds.add(id);
            this.render();
            return;
        } 

        this.ui.mode = 'dragging_memo';
        this.ui.draggedMemoId = id;
        this.ui.lastMouse = { x: e.clientX, y: e.clientY };
        if (this.ui.selectedMemoIds.has(id)) {
            this.ui.selectedMemoIds.clear();
        } else {
            this.ui.selectedMemoIds.clear();
            this.ui.selectedMemoIds.add(id);
        }
        this.render();
    },

    // --- Editor & ETC ---
    openEditor(id) {
        this.ui.editingId = id;
        const memo = this.findItem(id);
        const val = memo.type === 'link' ? memo.url : memo.content;
        document.getElementById('editor-textarea').value = val;
        document.getElementById('editor-modal').classList.add('active');
    },
    closeEditor() {
        document.getElementById('editor-modal').classList.remove('active');
        this.ui.editingId = null;
    },
    saveEditor() {
        if (!this.ui.editingId) return;
        const val = document.getElementById('editor-textarea').value;
        const memo = this.findItem(this.ui.editingId);
        if (memo) {
            if (memo.type === 'link' && memo.url !== val.trim()) {
                // 주소가 바뀌면 제목/이미지를 다시 불러옴
                memo.url = val.trim(); delete memo.meta; delete memo._loading;
            }
            else memo.content = val;
            this.render(); this.saveToStorage();
        }
        this.closeEditor();
    },
    deleteCurrentMemo() {
        if(confirm('삭제하시겠습니까?')) {
            this.data.memos = this.data.memos.filter(m => m.id !== this.ui.editingId);
            this.data.connections = this.data.connections.filter(c => c.from !== this.ui.editingId && c.to !== this.ui.editingId);
            this.closeEditor(); this.render(); this.saveToStorage();
        }
    },
    clearBoard() {
        if(confirm("초기화 하시겠습니까?")) {
            this.data = { memos: [], connections: [] };
            this.ui.camera = { x: 0, y: 0 };
            this.updateTransform();
            this.render(); this.saveToStorage();
        }
    },
    async findDriveFile(name) {
        const res = await fetch(`https://${localStorage.getItem('host')}/api/drive/files/find`, {
            method: 'POST',
            body: JSON.stringify({ name }),
            headers: {
                'Authorization': `Bearer ${localStorage.getItem('accessToken')}`,
                'Content-Type': 'application/json',
            },
            credentials: 'omit',
        })
        return await res.json()
    },
    // 드라이브 파일은 보통 바로 받을 수 있음. 서버가 막아 둔 경우에만 외부 중계(allorigins)를 거침
    async downloadDriveFile(url) {
        try {
            const res = await fetch(url, { credentials: 'omit' })
            if (!res.ok) throw new Error(res.status)
            return JSON.parse(await res.text())
        } catch (e) {
            const data = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(url))
            const dataJSON = await data.json()
            const splitted = dataJSON.contents.split('base64,')[1].split('"')[0]
            return JSON.parse(decodeURIComponent(escape(atob(splitted))))
        }
    },
    async fetchData() {
        if (localStorage.getItem('accessToken')) {
            if (confirm("불러오시겠습니까? 기존 캔버스를 덮어씌웁니다.")) {

                let fileJSON = await this.findDriveFile(`constelgrid.json`)
                // 예전 이름으로만 저장돼 있으면 그걸 불러옴 (예전 파일은 백업으로 남겨 둠)
                if (fileJSON.length === 0) fileJSON = await this.findDriveFile(`constelgrid_test.json`)
                if (fileJSON.length > 0) {
                    const parsedData = await this.downloadDriveFile(fileJSON[0].url)

                    this.data = parsedData
                    this.migrateWebs()
                    this.render()
                    this.saveToStorage()
                }
            }
        }
    },
    async exportData() {
        const dataStr = JSON.stringify(this.data, (k, v) => k === '_loading' ? undefined : v, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        console.log(blob)
        if (localStorage.getItem('accessToken')) {
            const formData = new FormData();
            formData.append("file", blob, "constelgrid.json");
            formData.append("name", "constelgrid.json");

            if (confirm("저장하시겠습니까? 기존 드라이브 데이터를 덮어씌웁니다.")) {
                const fileJSON = await this.findDriveFile(`constelgrid.json`)
                if (fileJSON.length > 0) {
                    
                    const deleteMifile = await fetch(`https://${localStorage.getItem('host')}/api/drive/files/delete`, {
                        method: 'POST',
                        body: JSON.stringify({
                            fileId: fileJSON[0].id
                        }),
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('accessToken')}`,
                            'Content-Type': 'application/json',
                        },
                        credentials: 'omit',
                    })
                }

                const file = await fetch(`https://${localStorage.getItem('host')}/api/drive/files/create`, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('accessToken')}`,
                    },
                    credentials: 'omit',
                })
                alert("저장되었습니다.")
            }
        } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `constelgrid_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }
    },
    importData(input) {

            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    this.data = JSON.parse(e.target.result);
                    this.migrateWebs();
                    this.ui.camera = { x: 0, y: 0 };
                    this.updateTransform();
                    this.render(); this.saveToStorage();
                } catch (err) { alert("파일 오류"); }
            };
            reader.readAsText(file);
            input.value = '';

    },
    saveToStorage() { 
        localStorage.setItem('mindgrid_final', JSON.stringify(this.data, (k, v) => k === '_loading' ? undefined : v)); 
    },
    loadFromStorage() {
        const d = localStorage.getItem('mindgrid_final');
        if(d) { this.data = JSON.parse(d); this.migrateWebs(); }
        this.render();
}
};

app.init();
</script>
